<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pose Image Check</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    .wrap { position: relative; display: inline-block; max-width: 100%; }
    .wrap img, .wrap canvas { display: block; max-width: 100%; height: auto; }
    .wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Pose image check</h1>
    <p class="note">Developer tool for validating rules on single photos (e.g. the peak frame of a leap).
      Pick a photo; it measures the split and passé angles with the same code the live app uses.
      Nothing is uploaded.</p>
    <p><input id="file" type="file" accept="image/*"></p>
    <div class="wrap"><img id="img" alt=""><canvas id="overlay"></canvas></div>
    <pre id="out">Loading pose model…</pre>
  </main>
  <script type="module">
    import { getImageTracker, landmarksFromImage, analyzeLandmarks } from '../js/tools/analyzeImage.js';
    import { drawSkeleton } from '../js/draw.js';
    import { setPoseLibrary } from '../js/elements/balances.js';
    import { currentLibrary } from '../js/ui/libraryStore.js';

    // Same recognition as the app: default library + poses taught in this browser.
    setPoseLibrary(currentLibrary());

    const out = document.getElementById('out');
    const img = document.getElementById('img');
    const canvas = document.getElementById('overlay');
    await getImageTracker();
    out.textContent = 'Ready. Choose a photo.';

    async function analyze(src) {
      img.src = src;
      await img.decode();
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const lm = await landmarksFromImage(img);
      drawSkeleton(canvas.getContext('2d'), lm);
      if (!lm) {
        out.textContent = 'No person found.';
        window.result = { found: false };
        return;
      }
      const a = analyzeLandmarks(lm);
      const { leap, passe, balance } = a;
      window.result = { found: true, ...a };
      out.textContent = [
        `Split angle: ${a.split.toFixed(1)}°   (leg visibility ${a.visibility.toFixed(2)})`,
        `If this is the peak of a split leap -> DB ${leap.dbValid ? 'valid' : 'NOT valid'} ${leap.dbValue.toFixed(2)}, ` +
          `${leap.penalties.map((p) => `E −${p.value.toFixed(2)} ${p.reason}`).join('; ') || 'no E penalty'}`,
        ...leap.warnings.map((w) => `⚠ ${w}`),
        `Leg length / torso: ${a.legRatios.map((r) => r.toFixed(2)).join(', ')} (full length is about 1.8-2.1)`,
        `Passé check: thigh ${passe.thighDeg.toFixed(0)}°, support knee ${passe.supportKneeDeg.toFixed(0)}°, in passé shape: ${passe.inShape}`,
        `Balance shape: ${a.shape}` +
          (balance.shape ? ` · ${balance.deviations.map((d) => `${d.label} ${Math.round(d.deg)}°`).join(', ')} · shape deduction ${a.deduction.toFixed(2)}` : '') +
          (a.legsVisible ? ` · help ${balance.help} · relevé ${balance.releve} · facing ${balance.facing}` +
            ` · free knee ${Math.round(balance.freeKnee ?? 0)}° · trunk ${Math.round(balance.trunk ?? 0)}°` : ' · legs not visible'),
      ].join('\n');
    }

    document.getElementById('file').addEventListener('change', (e) => {
      const f = e.target.files?.[0];
      if (f) analyze(URL.createObjectURL(f));
    });
    // Dev convenience: tools/image-check.html?src=<same-origin image path>
    const src = new URLSearchParams(location.search).get('src');
    if (src) analyze(src);
  </script>
</body>
</html>
